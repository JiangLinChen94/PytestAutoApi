- feature: 账务中心-账户管理
  story: 批量新增列表
  title: '$ddt{title}'
  request:
    method: post
    url: ${get_env()}gateway/std-account-client/std/account/importFilePage
    params: null
    json: {"belongBrand":"$ddt{belongBrand}","fileName":"$ddt{fileName}","createName":"$ddt{createName}","processingStatus":"$ddt{processingStatus}","fileType":"$ddt{fileType}","startCreateDate":"$ddt{startCreateDate}","endCreateDate":"$ddt{startCreateDate}","pageNum":1,"pageSize":50}
    headers: { "Content-type": "application/json","Authorization": "Bearer ${read_extract(token)}" }
  extract: null
  validate:
    equals:
      断言状态为true: [ "True", "success" ]
    contains:
      断言返回内容包含预期值: [ "$ddt{assert_content}", "text" ]
  parametrize:
    - [ title,belongBrand,fileName,createName,processingStatus,fileType,startCreateDate,endCreateDate,assert_content ]
