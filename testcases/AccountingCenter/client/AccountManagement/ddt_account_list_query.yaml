-  feature: 账务中心-账户管理
   story: 账户列表查询
   title: '$ddt{title}'
   request:
     method: post
     url: ${get_env()}gateway/std-account-client/std/account/page
     params: null
     json: { "belongBrand": '$ddt{belongBrand}', "accBaseCode": '$ddt{accBaseCode}', "ownerSourceId": '$ddt{ownerSourceId}', "baseBizCode": '$ddt{baseBizCode}', "ownerType": '$ddt{ownerType}',
             "status": '$ddt{status}', "pageNum": 1, "pageSize": 10 }
     headers: { "Content-type": "application/json","Authorization": "Bearer ${read_extract(token)}" }
   extract: null
   validate:
     equals:
       断言状态为true: [ "True", "success" ]
     contains:
       响应内容包含的数据: [ "$ddt{assert_accBaseCode}", "text" ]
   parametrize:
     - [ title,belongBrand,accBaseCode,ownerSourceId,baseBizCode,ownerType,status,assert_accBaseCode ]
     - [ "根据品牌LSHM查询数据成功","LSHM","","","","","","LSHM" ]
     - [ "根据品牌ZYM查询数据成功","ZYM","","","","","","ZYM" ]
     - [ "根据账户名称查询数据成功","","${accBaseCode}","","","","","${accBaseCode}" ]
     - [ "根据支付侧主商编查询数据成功","","","${ownerSourceId}","","","","${ownerSourceId}" ]
     - [ "根据主体代码查询数据成功","","","","${baseBizCode}","","","${baseBizCode}" ]
     - [ "根据主体代码查询数据成功","","","","","${ownerType}","","${ownerType}" ]
     - [ "根据状态查询数据成功","","","","","","${status}","${status}" ]
