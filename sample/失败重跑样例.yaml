- feature: 重跑功能测试
  story: 失败重跑测试
  title: 重跑3次测试用例
  retry: 3  # 重跑3次
  request:
    method: get
    url: https://httpbin.org/status/500  # 模拟服务器错误
    params: null
    json: null
    headers: null
  extract: null
  validate:
    equals:
      断言状态码为200: [ "200", "status_code" ]  # 这个断言会失败

